# Modest caps: WSL has ~8 GB shared with everything else.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle JVM: the separate Kotlin daemon is reached over a loopback
# socket, and with WSL networkingMode=mirrored a connect to a stale daemon's port hangs forever.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
